name: SL-3000 eMMC (Pinned OpenWrt)

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Skip restoring caches; save fresh caches after successful stages
        type: boolean
        default: false
      publish_release:
        description: Publish validated outputs as a prerelease (no hardware certification)
        type: boolean
        default: false
      public_setup_password:
        description: I accept that the image contains a PUBLIC TEMPORARY Wi-Fi password
        type: boolean
        default: false
      rf_test:
        description: Private same-router runtime EEPROM A/B test; encrypted artifact only
        type: boolean
        default: false
      nor_probe:
        description: Private read-only NOR diagnosis; requires rf_test, keeps its Wi-Fi EEPROM
        type: boolean
        default: false
      factory_test:
        description: Public test; per-device read-only Factory with public generic EEPROM fallback
        type: boolean
        default: false
      compare_run:
        description: Optional baseline run ID for compile-time comparison (queue time excluded)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: sl3000-emmc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Shanghai
      RECIPE: devices/sl3000_emmc
      OPENWRT: ${{ github.workspace }}/openwrt-sl3000
      CCACHE_DIR: ${{ github.workspace }}/openwrt-sl3000/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/openwrt-sl3000
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2GiB
      SL3000_RF_TEST: ${{ inputs.rf_test && 'true' || 'false' }}
      SL3000_NOR_PROBE: ${{ inputs.nor_probe && 'true' || 'false' }}
      SL3000_FACTORY_TEST: ${{ inputs.factory_test && 'true' || 'false' }}
    steps:
      - name: Checkout recipe
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Preflight inputs
        env:
          DEFAULT_WIFI_PASSWORD: ${{ secrets.DEFAULT_WIFI_PASSWORD }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          PUBLIC_SETUP_PASSWORD: ${{ inputs.public_setup_password }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          SL3000_RF_TEST_CALIBRATION: ${{ inputs.rf_test && secrets.SL3000_RF_TEST_CALIBRATION || '' }}
          SL3000_RF_TEST_PASSPHRASE: ${{ inputs.rf_test && secrets.SL3000_RF_TEST_PASSPHRASE || '' }}
        run: |
          if [[ "$REPOSITORY_PRIVATE" != true && "$PUBLIC_SETUP_PASSWORD" != true ]]; then
            echo 'Public images expose their Wi-Fi password. Confirm use of a public temporary password.'
            exit 1
          fi
          python3 "$RECIPE/rf_test.py" preflight --publish-release "$PUBLISH_RELEASE"
          PYTHONPATH="$RECIPE" python3 -c 'import os; from inject_defaults import validate_password; validate_password(os.environ.get("DEFAULT_WIFI_PASSWORD", ""))'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget zstd \
            libelf-dev libtool autoconf automake cmake ninja-build pkgconf \
            ccache curl jq patch perl time squashfs-tools gnupg device-tree-compiler \
            u-boot-tools libarchive-tools
          df -h .

      - name: Unit tests including compiled device trees
        env:
          SL3000_RF_TEST: 'false'
          SL3000_NOR_PROBE: 'false'
          SL3000_FACTORY_TEST: 'false'
        run: python3 -m unittest discover -s "$RECIPE/tests" -v

      - name: Compute independent cache keys
        id: cache_keys
        env:
          RECIPE_HASH: ${{ hashFiles('devices/sl3000_emmc/sources.lock.json', 'devices/sl3000_emmc/.config', 'devices/sl3000_emmc/prepare.py', 'devices/sl3000_emmc/nor_probe.py', 'devices/sl3000_emmc/factory_test.py', 'devices/sl3000_emmc/image.mk', 'devices/sl3000_emmc/files/**', 'devices/sl3000_emmc/packages/**') }}
          BUILD_PROFILE: ${{ inputs.factory_test && 'factory-test' || inputs.nor_probe && 'nor-probe' || inputs.rf_test && 'rf-test' || 'generic' }}
        run: |
          namespace="sl3000-v2-ubuntu-24.04-${RUNNER_OS}-${RUNNER_ARCH}"
          download_prefix="${namespace}-dl-${RECIPE_HASH}-"
          compiler_prefix="${namespace}-ccache-${BUILD_PROFILE}-${RECIPE_HASH}-"
          {
            echo "download_prefix=$download_prefix"
            echo "download_fallback=${namespace}-dl-"
            echo "download_key=${download_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "compiler_prefix=$compiler_prefix"
            echo "compiler_key=${compiler_prefix}${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore downloaded sources
        id: restore_downloads
        if: ${{ !inputs.clean_build }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: openwrt-sl3000/dl
          key: ${{ steps.cache_keys.outputs.download_key }}
          restore-keys: |
            ${{ steps.cache_keys.outputs.download_prefix }}
            ${{ steps.cache_keys.outputs.download_fallback }}

      - name: Restore compiler cache
        id: restore_compiler
        if: ${{ !inputs.clean_build }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: openwrt-sl3000/.ccache
          key: ${{ steps.cache_keys.outputs.compiler_key }}
          restore-keys: ${{ steps.cache_keys.outputs.compiler_prefix }}

      - name: Prepare pinned source and feeds
        run: python3 "$RECIPE/prepare.py" "$OPENWRT"

      - name: Resolve and verify build configuration
        run: |
          make -C "$OPENWRT" defconfig
          python3 "$RECIPE/verify.py" config "$OPENWRT"

      - name: Inject setup defaults
        env:
          DEFAULT_WIFI_PASSWORD: ${{ secrets.DEFAULT_WIFI_PASSWORD }}
        run: python3 "$RECIPE/inject_defaults.py" "$OPENWRT"

      - name: Inject private runtime EEPROM for the same-router RF test
        if: ${{ inputs.rf_test }}
        env:
          SL3000_RF_TEST_CALIBRATION: ${{ inputs.rf_test && secrets.SL3000_RF_TEST_CALIBRATION || '' }}
        run: python3 "$RECIPE/rf_test.py" inject "$OPENWRT"

      - name: Download verified package sources
        id: download
        run: /usr/bin/time -f 'Download elapsed %E; peak process RSS %M KiB' make -C "$OPENWRT" download -j8

      - name: Save downloaded sources
        if: ${{ !cancelled() && steps.download.outcome == 'success' && (inputs.clean_build || !startsWith(steps.restore_downloads.outputs.cache-matched-key, steps.cache_keys.outputs.download_prefix)) }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: openwrt-sl3000/dl
          key: ${{ steps.cache_keys.outputs.download_key }}

      - name: Select build parallelism and reset cache statistics
        id: resources
        run: |
          jobs=$(python3 "$RECIPE/ci_resources.py")
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          ccache --zero-stats
          free -h
          df -h .

      - name: Compile
        id: compile
        env:
          BUILD_JOBS: ${{ steps.resources.outputs.jobs }}
        run: /usr/bin/time -v -o "$RUNNER_TEMP/sl3000-compile-time.txt" make -C "$OPENWRT" -j"$BUILD_JOBS"

      - name: Record build and cache statistics
        id: cache_stats
        if: ${{ !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        continue-on-error: true
        env:
          BUILD_JOBS: ${{ steps.resources.outputs.jobs }}
          DOWNLOAD_CACHE: ${{ steps.restore_downloads.outputs.cache-matched-key }}
          COMPILER_CACHE: ${{ steps.restore_compiler.outputs.cache-matched-key }}
        run: |
          ccache_bin="$OPENWRT/staging_dir/host/bin/ccache"
          if [[ ! -x "$ccache_bin" ]]; then
            ccache_bin=/usr/bin/ccache
          fi
          "$ccache_bin" --cleanup
          "$ccache_bin" --show-stats | tee "$RUNNER_TEMP/sl3000-ccache-stats.txt"
          {
            echo '### Build performance'
            echo
            echo "Make jobs: $BUILD_JOBS"
            echo
            echo "Download cache restored: ${DOWNLOAD_CACHE:-none}"
            echo
            echo "Compiler cache restored: ${COMPILER_CACHE:-none}"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/sl3000-compile-time.txt" "$RUNNER_TEMP/sl3000-ccache-stats.txt"
            du -sh "$OPENWRT/dl" "$CCACHE_DIR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save compiler cache
        # An initramfs build can place embedded file data in compiler outputs.
        if: ${{ !inputs.rf_test && !cancelled() && steps.compile.outcome == 'success' && steps.cache_stats.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: openwrt-sl3000/.ccache
          key: ${{ steps.cache_keys.outputs.compiler_key }}

      - name: Verify and collect only approved outputs
        env:
          DEFAULT_WIFI_PASSWORD: ${{ secrets.DEFAULT_WIFI_PASSWORD }}
          SL3000_RF_TEST_CALIBRATION: ${{ inputs.rf_test && secrets.SL3000_RF_TEST_CALIBRATION || '' }}
        run: |
          python3 "$RECIPE/verify.py" artifacts "$OPENWRT" --output "$RUNNER_TEMP/sl3000-release"
          cd "$RUNNER_TEMP/sl3000-release"
          sha256sum -c sha256sums

      - name: Upload verified firmware
        if: ${{ !inputs.rf_test }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sl3000-emmc-${{ inputs.factory_test && 'factory-test-' || '' }}${{ github.run_id }}
          path: ${{ runner.temp }}/sl3000-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Encrypt device-specific RF test artifacts
        if: ${{ inputs.rf_test }}
        env:
          SL3000_RF_TEST_PASSPHRASE: ${{ secrets.SL3000_RF_TEST_PASSPHRASE }}
        run: python3 "$RECIPE/rf_test.py" encrypt "$RUNNER_TEMP/sl3000-release" "$RUNNER_TEMP/sl3000-encrypted"

      - name: Upload encrypted RF test firmware only
        if: ${{ inputs.rf_test }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sl3000-emmc-${{ inputs.nor_probe && 'nor-probe' || 'rf-test' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sl3000-encrypted/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo '### SL-3000 eMMC'
            echo 'OpenWrt 25.12.5, pinned feeds and proxy components.'
            echo 'Ruby/YAML retained; optional Ruby YJIT disabled; no Rust host toolchain built.'
            echo 'Image checks passed. Hardware acceptance is still required.'
            echo 'Only sysupgrade/initramfs and verification records are exported. No BL2/FIP/GPT.'
            echo 'The setup Wi-Fi password is extractable from the image. Change it on first login.'
            if [[ "$SL3000_RF_TEST" == true ]]; then
              echo 'PRIVATE RF PROFILE: captured runtime EEPROM, pinned mt76/MCU versions.'
              echo 'Only an AES-256 encrypted archive is uploaded. The decryption key is held locally.'
              echo 'Use only on the source router. Do not redistribute the decrypted images.'
            fi
            if [[ "$SL3000_NOR_PROBE" == true ]]; then
              echo 'NOR DIAGNOSTIC: one read-only raw partition; hardware write protection retained.'
              echo 'No factory-to-Wi-Fi NVMEM binding. Current runtime EEPROM is retained.'
              echo 'Same-base LuCI sysupgrade with Keep settings is supported; back up configuration first.'
            fi
            if [[ "$SL3000_FACTORY_TEST" == true ]]; then
              echo 'PUBLIC FACTORY TEST: read-only Factory NVMEM at 0x180000, EEPROM size 4096 bytes.'
              echo 'Unmodified mt76 retains the pinned public generic EEPROM fallback; coverage may be poor on fallback.'
              echo 'No private calibration input or encryption. Both images checked for the public EEPROM and profile.'
              echo 'Artifact only, no Release. Matching hardware/layout requires post-flash validation.'
              echo 'Same-base LuCI sysupgrade with Keep settings is supported; back up configuration first.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare compile time with baseline
        if: ${{ inputs.compare_run != '' && !cancelled() && steps.compile.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ inputs.compare_run }}
        run: |
          python3 "$RECIPE/ci_compare.py" --baseline-run "$BASELINE_RUN" \
            --current-run "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY"

  release:
    if: ${{ inputs.publish_release && !inputs.rf_test && !inputs.factory_test }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sl3000-emmc-${{ github.run_id }}
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECIPE_COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd release
          sha256sum -c sha256sums
          gh release create "sl3000-25.12.5-${RUN_NUMBER}" ./* \
            --target "$RECIPE_COMMIT" --prerelease \
            --title "SL-3000 eMMC / OpenWrt 25.12.5 / test ${RUN_NUMBER}" \
            --notes-file README.md
